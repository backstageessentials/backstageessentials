<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3400" viewBox="0 0 1600 3400">
  <defs>
    <filter id="w" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="19" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="26" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.3"/>
    </filter>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7a5230" stop-opacity=".01"/>
      <stop offset=".80" stop-color="#7a5230" stop-opacity=".04"/>
      <stop offset="1" stop-color="#5f3d20" stop-opacity=".08"/>
    </radialGradient>
  </defs>
  <!-- folds: one across, one down -->
  <rect x="0" y="1296" width="1600" height="2" fill="#3b2f1e" fill-opacity=".09"/>
  <rect x="0" y="1298" width="1600" height="2" fill="#ffffff" fill-opacity=".35"/>
  <rect x="796" y="0" width="2" height="3400" fill="#3b2f1e" fill-opacity=".05"/>
  <rect x="798" y="0" width="2" height="3400" fill="#ffffff" fill-opacity=".22"/>
  <g filter="url(#w)">
    <!-- one ring, top right -->
    <circle cx="1360" cy="290" r="112" fill="url(#pool)"/>
    <circle cx="1360" cy="290" r="112" fill="none" stroke="#5f3d20" stroke-opacity=".16" stroke-width="4" stroke-dasharray="500 210"/>
    <circle cx="1470" cy="170" r="5" fill="#5f3d20" fill-opacity=".14"/>
    <!-- one smaller ring much further down -->
    <circle cx="170" cy="2100" r="88" fill="url(#pool)"/>
    <circle cx="170" cy="2100" r="88" fill="none" stroke="#5f3d20" stroke-opacity=".15" stroke-width="4" stroke-dasharray="400 150"/>
  </g>
</svg>
